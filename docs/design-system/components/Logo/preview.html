<!doctype html>
<html>

<style>
  html, body { margin: 0; }
  body { background: var(--bg-000); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--space-3); padding: var(--space-4); }
  .tile { position: relative; border-radius: var(--radius-lg); background: var(--bg-100); box-shadow: inset 0 0 0 1px var(--line); padding: var(--space-6); min-height: 150px; display: flex; align-items: center; justify-content: center; gap: var(--space-6); flex-wrap: wrap; }
  .tile.light { background: #f4f2fa; }

  .cap { position: absolute; left: var(--space-4); top: var(--space-3); font: 500 11px/14px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); }
  .light .cap { color: #4b4560; }
  .clear { position: relative; padding: 18px; outline: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; }
  .note { position: absolute; left: var(--space-4); bottom: var(--space-3); font: 400 11px/14px var(--font-mono); color: var(--ink-faint); }
  .apps { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: center; gap: var(--space-6); background: #26252c; }
  .apps figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .apps figcaption { font: 400 11px/14px var(--font-mono); color: #b9b5c8; }
  .apps img { display: block; }
  .sizes { display: flex; align-items: flex-end; gap: var(--space-4); }
</style></head>
