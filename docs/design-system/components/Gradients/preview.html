<!-- @dsCard group="Premium" page height=260 subtitle="Light recipes in bundle.css, built from the color tokens" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Gradients</title>
<style>
  body{background:var(--bg-000)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);padding:var(--space-6)}
  .sw{height:120px;border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--line)}
  .lbl{margin-top:var(--space-2);font:500 12px/16px var(--font-mono);color:var(--ink)}
  .use{font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
  .ring{--wp-neon-fill:var(--bg-100)}
  .txt{display:grid;place-items:center;background:var(--bg-100);font:600 40px/1 var(--font-sans);letter-spacing:-.03em}
</style></head>
<body>
<div class="grid">
  <div><div class="sw" style="background:var(--grad-brand)"></div><div class="lbl">--grad-brand</div><div class="use">Primary button, send, checkbox</div></div>
  <div><div class="sw" style="background:var(--grad-ai)"></div><div class="lbl">--grad-ai</div><div class="use">AI text and icons</div></div>
  <div><div class="sw" style="background:var(--grad-aurora),var(--bg-100)"></div><div class="lbl">--grad-aurora</div><div class="use">Welcome background; never behind code</div></div>
  <div><div class="sw txt"><span class="wp-grad-text">Walph</span></div><div class="lbl">.wp-grad-text</div><div class="use">Wordmark, "Claude Code", "Perguntar ao Claude"</div></div>
</div>
</body>
</html>
