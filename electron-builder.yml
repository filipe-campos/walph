appId: dev.walph.ide
productName: Walph
copyright: Copyright © 2026 Filipe Campos
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Fake SDK of the tests (WALPH_FAKE_CLAUDE): ignored in the packaged app, no need to ship it
  - '!out/main/fake-*.js'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Keeps the tsserver lib.*.d.ts, which electron-builder drops from node_modules with no `files` exception
onNodeModuleFile: scripts/keep-tsserver-libs.mjs
# Native binaries cannot run from inside the .asar
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/@parcel/watcher*/**'
  # Each platform has its own package (@vscode/ripgrep-<os>-<arch>/bin/rg)
  - '**/node_modules/@vscode/ripgrep-*/**'
  # Run by another process (Electron as Node): typescript-language-server and the tsserver it starts
  - '**/node_modules/typescript-language-server/**'
  - '**/node_modules/tsserver-bundled/**'
  # Claude panel: the SDK starts the native CLI (binary from the per-platform package) as a child process
  - '**/node_modules/@anthropic-ai/claude-agent-sdk*/**'
# Auto update (electron-updater): electron-builder writes app-update.yml from here. CI publishes on tag creation.
publish:
  provider: github
  owner: filipe-campos
  repo: walph
  # Draft: the three release.yml jobs upload the files and the last one publishes
  releaseType: draft
mac:
  # The zip is required by Squirrel.Mac (auto update), even for those who install from the dmg
  target:
    - dmg
    - zip
  # Design system icon: squircle on the Apple grid (the square icon.png is the Windows/Linux one)
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
  # Signing: CSC_LINK/CSC_KEY_PASSWORD (or the certificate in the Keychain). Notarization: APPLE_API_KEY/
  # APPLE_API_KEY_ID/APPLE_API_ISSUER or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID. Without any of these the
  # build is unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  executableName: walph
  maintainer: Filipe Campos <filipefcl@hotmail.com>
  synopsis: Personal IDE with editor, terminal, Git and Claude Code
  description: Walph is a personal IDE built with Electron and React.
# No version in the AppImage name: the updater replaces the file at the same path and the `walph` launcher (which
# records $APPIMAGE) stays valid; with the version in the name it would delete the old one and create another.
appImage:
  artifactName: ${productName}-${os}-${arch}.${ext}
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
dmg:
  # electron-builder defaults; the Finder icon of the .dmg FILE is applied by the hook below
  title: ${productName} ${version}
afterAllArtifactBuild: scripts/dmg-file-icon.mjs
