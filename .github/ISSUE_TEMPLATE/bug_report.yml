name: Bug report
description: Something in Walph is broken or behaves unexpectedly
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the [existing issues](https://github.com/filipe-campos/walph/issues) first.
        Security vulnerabilities must **not** be reported here; follow the [security policy](https://github.com/filipe-campos/walph/security/policy) instead.

  - type: input
    id: version
    attributes:
      label: Walph version
      description: On macOS, **Walph > About Walph**. Otherwise, the version of the release you installed (or the commit, when running from source).
      placeholder: e.g. 0.5.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: e.g. macOS 26.1 (arm64), Windows 11 24H2 (x64), Ubuntu 24.04 (x64)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running Walph?
      options:
        - Installed release (dmg, zip, NSIS, AppImage, deb)
        - From source (pnpm dev)
        - From source (pnpm build / pnpm dist)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smaller the reproduction, the faster the fix. Mention the kind of folder or repository you opened if it matters.
      placeholder: |
        1. Open a folder with ...
        2. Click on ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Screenshots or a short recording help a lot.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Error notifications shown by the app, the output of the terminal running `pnpm dev`, or the developer tools console (available in dev builds).
        Please remove tokens, paths or anything private before pasting.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related settings, language servers, Docker or Claude Code versions, or anything else that might help.
